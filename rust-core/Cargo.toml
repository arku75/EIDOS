[package]
name = "eidos_core"
version = "0.2.0"
edition = "2021"

[lib]
name = "eidos_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "eidos_knowledge"
path = "src/main.rs"

[dependencies]
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"], optional = true }

[dev-dependencies]
tempfile = "3.0"

[features]
default = ["python"]
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = true
