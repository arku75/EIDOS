<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ EIDOS Colony Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #00d4aa, #6b8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .panel-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #00d4aa;
        }

        /* EDIFICIOS */
        .buildings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .building {
            background: rgba(15, 52, 96, 0.5);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .building:hover {
            transform: translateY(-5px);
            border-color: #00d4aa;
            box-shadow: 0 10px 30px rgba(0, 212, 170, 0.3);
        }

        .building-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .building-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .building-balance {
            color: #ffd700;
            font-size: 0.9rem;
        }

        /* CHAT */
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .message {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #00d4aa;
        }

        .message-header {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .message-sender {
            font-weight: bold;
        }

        .message-time {
            color: #888;
            font-size: 0.8rem;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 1rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: #00d4aa;
        }

        .btn {
            background: linear-gradient(90deg, #00d4aa, #00a884);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,212,170,0.4);
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4aa;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ EIDOS Colony Dashboard</h1>
            <p>Sistema de agentes autónomos trabajando 24/7</p>
        </div>

        <div class="grid">
            <!-- IZQUIERDA: Edificios + Stats -->
            <div>
                <div class="panel">
                    <div class="panel-title">🏢 Edificios & Agentes</div>
                    <div class="buildings-grid" id="buildingsGrid">
                        <div class="loading">Cargando agentes...</div>
                    </div>
                </div>

                <div class="panel" style="margin-top: 20px;">
                    <div class="panel-title">📊 Estadísticas</div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="totalAgents">0</div>
                            <div class="stat-label">Agentes</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalMessages">0</div>
                            <div class="stat-label">Mensajes</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalTokens">0</div>
                            <div class="stat-label">Tokens</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">🟢</div>
                            <div class="stat-label">Online</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DERECHA: Chat -->
            <div class="panel">
                <div class="panel-title">💬 Chat con Agentes</div>
                <div class="chat-messages" id="chatMessages">
                    <div class="message">
                        <div class="message-header">
                            <span>🔔</span>
                            <span class="message-sender">Sistema</span>
                        </div>
                        <div>Bienvenido a EIDOS Colony. Escribe un mensaje para hablar con los agentes.</div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput"
                           placeholder="Escribe tu mensaje..."
                           onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="btn" onclick="sendMessage()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let agents = [];
        let messageCount = 0;

        // Inicializar
        async function init() {
            console.log('🚀 Iniciando dashboard...');
            await loadAgents();
            await loadStats();
            startPolling();
        }

        // Cargar agentes
        async function loadAgents() {
            try {
                console.log('📡 Cargando agentes desde API...');
                const res = await fetch('/api/agents');
                const data = await res.json();

                console.log('📦 Respuesta recibida:', data);

                if (data.success && data.agents) {
                    agents = data.agents;
                    console.log('✅ Agentes cargados:', agents.length);
                    renderBuildings();
                    document.getElementById('totalAgents').textContent = agents.length;
                } else {
                    console.error('❌ Error en respuesta:', data);
                }
            } catch (e) {
                console.error('❌ Error cargando agentes:', e);
                document.getElementById('buildingsGrid').innerHTML =
                    '<div class="loading" style="color: #ff6b6b;">Error: No se pudo conectar con el servidor</div>';
            }
        }

        // Renderizar edificios
        function renderBuildings() {
            console.log('🏗️ Renderizando', agents.length, 'edificios...');
            const grid = document.getElementById('buildingsGrid');

            if (!grid) {
                console.error('❌ No se encontró buildingsGrid');
                return;
            }

            grid.innerHTML = agents.map((agent, i) => {
                console.log(`  ${i+1}/${agents.length}: ${agent.name} (${agent.emoji})`);
                return `
                    <div class="building" onclick="alert('${agent.name}\\n${agent.traits.join(', ')}')">
                        <div class="building-icon">${agent.emoji}</div>
                        <div class="building-name">${agent.name}</div>
                        <div style="font-size: 0.8rem; color: #888; margin: 5px 0;">${agent.building.name}</div>
                        <div class="building-balance">💰 ${agent.tokens_balance.toFixed(1)}</div>
                    </div>
                `;
            }).join('');

            console.log('✅ Edificios renderizados');
        }

        // Cargar estadísticas
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (data.success && data.stats) {
                    document.getElementById('totalTokens').textContent =
                        (data.stats.total_rewards || 0).toFixed(0);
                }
            } catch (e) {
                console.error('Error cargando stats:', e);
            }
        }

        // Enviar mensaje
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();

            if (!msg) return;

            input.value = '';
            addMessage('👤', 'SER', msg);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });

                const data = await res.json();

                if (data.success && data.responses) {
                    data.responses.forEach(r => {
                        addMessage(r.sender_emoji, r.sender_name, r.content);
                    });
                    messageCount += data.responses.length + 1;
                    document.getElementById('totalMessages').textContent = messageCount;
                }
            } catch (e) {
                addMessage('❌', 'Error', 'No se pudo enviar el mensaje');
                console.error('Error enviando mensaje:', e);
            }
        }

        // Agregar mensaje al chat
        function addMessage(emoji, sender, content) {
            const chat = document.getElementById('chatMessages');
            const time = new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});

            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
                <div class="message-header">
                    <span>${emoji}</span>
                    <span class="message-sender">${sender}</span>
                    <span class="message-time">${time}</span>
                </div>
                <div>${content}</div>
            `;

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        // Polling cada 5 segundos
        function startPolling() {
            setInterval(() => {
                loadAgents();
                loadStats();
            }, 5000);
        }

        // Iniciar
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
