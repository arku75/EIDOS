name: sanitation-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile integration and autonomy layers
        run: |
          python -m py_compile \
            core/fly_lab.py \
            core/runtime_hub.py \
            core/autonomy_benchmark.py \
            core/self_edit_lab.py \
            core/zero_llm_acceptance.py \
            core/db.py \
            bin/eidos_agents_terminal.py
          python -m py_compile \
            tests/test_fly_lab.py \
            tests/test_runtime_hub.py \
            tests/test_agents_terminal.py \
            tests/test_autonomy_benchmark.py \
            tests/test_self_edit_lab.py \
            tests/test_self_edit_guardrails.py \
            tests/test_colony_effect_reputation.py \
            tests/test_db_thread_contract.py

      - name: Run pure integration tests
        run: |
          PYTHONPATH=. python -m unittest -v \
            tests.test_fly_lab \
            tests.test_runtime_hub \
            tests.test_agents_terminal \
            tests.test_autonomy_benchmark \
            tests.test_self_edit_lab \
            tests.test_self_edit_guardrails \
            tests.test_colony_effect_reputation \
            tests.test_db_thread_contract

      - name: Run autonomy benchmark
        run: |
          PYTHONPATH=. python core/autonomy_benchmark.py

  desktop-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install virtual desktop tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool x11-apps x11-utils xterm

      - name: Verify virtual mouse and keyboard primitives
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension XTEST >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 1

          # Hosted Xvfb runners can keep the virtual pointer pinned to the
          # screen centre even when XTEST is advertised. Verify the extension,
          # then test an observable keyboard effect. Real pointer movement is
          # reserved for the hardware-in-the-loop Dell suite.
          xdpyinfo -ext XTEST >/tmp/xtest.txt
          grep -q 'XTEST' /tmp/xtest.txt

          xterm -T EIDOS_TERMINAL_SMOKE -e bash -lc 'read line; printf "%s" "$line" > /tmp/eidos-typed.txt' >/tmp/xterm.log 2>&1 &
          XPID=$!
          sleep 1
          WIN="$(xdotool search --name EIDOS_TERMINAL_SMOKE | head -n1)"
          test -n "$WIN"
          xdotool windowfocus --sync "$WIN"
          xdotool type --delay 20 'EIDOS_KEYBOARD_OK'
          xdotool key Return
          wait "$XPID"
          grep -q '^EIDOS_KEYBOARD_OK$' /tmp/eidos-typed.txt

      - name: Verify local browser world
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory tests/fixtures/browser >/tmp/eidos-http.log 2>&1 &
          HPID=$!
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:8765/index.html > /tmp/eidos-dom.html
          grep -q EIDOS_BROWSER_OK /tmp/eidos-dom.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --screenshot=/tmp/eidos-browser.png http://127.0.0.1:8765/index.html
          test -s /tmp/eidos-browser.png
          kill "$HPID" || true


  dependency-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py
      - name: Create reusable job environment
        run: |
          python -m venv "${RUNNER_TEMP}/eidos-install-venv"
          echo "${RUNNER_TEMP}/eidos-install-venv/bin" >> "$GITHUB_PATH"
          mkdir -p reports
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Resolve public requirements without installing
        run: |
          python -m pip install --dry-run --ignore-installed --report reports/dependency-resolution.json -r requirements.txt

      - name: Verify installable EIDOS core and console scripts
        run: |
          # Base install contains the model-independent EIDOS core. Heavy ML,
          # browser and hardware stacks remain optional capability layers.
          python -m pip install .
          python -m pip check
          python -m pip freeze > reports/eidos-core-installed.txt
          export EIDOS_HOME="${RUNNER_TEMP}/eidos-install-state"
          cd "${RUNNER_TEMP}"

          eidos --help >/tmp/eidos-help.txt
          eidos-gateway --help >/tmp/eidos-gateway-help.txt
          eidos-config --help >/tmp/eidos-config-help.txt
          grep -q "EIDOS CASCADE" /tmp/eidos-help.txt
          grep -q "EIDOS Gateway CLI" /tmp/eidos-gateway-help.txt
          grep -q "EIDOS Config CLI" /tmp/eidos-config-help.txt
          eidos-config init
          eidos-config set gateway.port 19000
          test "$(eidos-config get gateway.port)" = "19000"
          test -s "${EIDOS_HOME}/config.yaml"

          # The installed distribution must expose the core and shared CLI,
          # while heavyweight model libraries remain optional.
          python - <<'PY'
          from importlib.metadata import distribution
          from importlib.util import find_spec

          top_level = {
              line.strip()
              for line in distribution("eidos-gateway")
              .read_text("top_level.txt")
              .splitlines()
              if line.strip()
          }
          required = {"core", "bin", "cli", "config", "gateway", "eidos"}
          assert required.issubset(top_level), (required, top_level)
          assert find_spec("torch") is None
          assert find_spec("transformers") is None
          PY

          eidos-acceptance-zero-llm learn > /tmp/eidos-zero-llm-learn.json
          eidos-acceptance-zero-llm verify > /tmp/eidos-zero-llm-verify.json
          grep -q '"effect_verified": true' /tmp/eidos-zero-llm-learn.json
          grep -q '"negative_control_rejected": true' /tmp/eidos-zero-llm-learn.json
          grep -q '"colony_routing": \["colony_coder", "colony_analyst"\]' /tmp/eidos-zero-llm-learn.json
          grep -q '"colony_routing_persisted": \["colony_coder", "colony_analyst"\]' /tmp/eidos-zero-llm-verify.json
          grep -q '"llm_modules_loaded": false' /tmp/eidos-zero-llm-verify.json

      - name: Record install continuity and checksums
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          reports = Path("reports")
          reports.mkdir(exist_ok=True)
          manifest = {
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner": os.environ["RUNNER_NAME"],
              "python": platform.python_version(),
              "scope": "installable model-independent EIDOS core; heavy optional runtime dependencies resolution-only",
              "restore": "checkout head; recreate venv; reuse pip cache keyed by requirements/setup; verify report hashes",
              "files": [],
          }
          for path in sorted(reports.iterdir()):
              if path.is_file() and path.name != "continuity.json":
                  data = path.read_bytes()
                  manifest["files"].append({"path": path.name, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          (reports / "continuity.json").write_text(json.dumps(manifest, indent=2))
          PY

      - name: Preserve install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eidos-install-evidence
          path: reports/
          retention-days: 7
          if-no-files-found: error
