name: sanitation-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile new integration layer
        run: |
          python -m py_compile core/fly_lab.py core/runtime_hub.py bin/eidos_agents_terminal.py
          python -m py_compile tests/test_fly_lab.py tests/test_runtime_hub.py
      - name: Run pure integration tests
        run: |
          PYTHONPATH=. python -m unittest -v tests.test_fly_lab tests.test_runtime_hub
